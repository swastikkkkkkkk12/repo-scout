[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-scout"
version = "0.1.0"
description = "A lightweight CLI that checks whether a repository is ready to share."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Repo Scout contributors" }]
dependencies = []

[project.scripts]
repo-scout = "repo_scout.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
